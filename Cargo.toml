[package]
name = "codex-switch"
version = "0.2.0"
edition = "2024"
description = "Multi-account runtime switcher for Codex"
license = "MIT"
repository = "https://github.com/seven332/codex-switch"
readme = "README.md"
keywords = ["codex", "cli", "openai", "oauth"]
categories = ["command-line-utilities"]
exclude = [".github/**"]

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
os_info = "3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "registry", "std"] }
futures-util = "0.3"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webbrowser = "1"

[target.'cfg(unix)'.dependencies]
crossterm = { version = "0.29", default-features = false }
nix = { version = "0.31", features = ["fs", "poll", "process", "signal"] }
pty-process = { version = "0.5.3", features = ["async"] }
