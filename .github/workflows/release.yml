name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  BIN_NAME: codex-switch
  CARGO_TERM_COLOR: always
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
  CC_aarch64_unknown_linux_musl: musl-gcc
  CC_x86_64_unknown_linux_musl: musl-gcc

jobs:
  detect:
    name: Detect version change
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect package version change
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          extract_version() {
            awk '
              /^\[package\]/ { in_package = 1; next }
              /^\[/ && in_package { exit }
              in_package && /^version = / {
                split($0, fields, "\"")
                print fields[2]
                exit
              }
            ' "$1"
          }

          version="$(extract_version Cargo.toml)"
          if [ -z "$version" ]; then
            echo "Package version not found in Cargo.toml" >&2
            exit 1
          fi

          release=false
          if printf '%s' "$BEFORE_SHA" | grep -Eq '^0+$'; then
            release=true
          else
            previous_cargo_toml="$(mktemp)"
            previous_version=""
            if git show "$BEFORE_SHA:Cargo.toml" > "$previous_cargo_toml" 2>/dev/null; then
              previous_version="$(extract_version "$previous_cargo_toml")"
            fi
            rm -f "$previous_cargo_toml"

            if [ "$previous_version" != "$version" ]; then
              release=true
            fi
          fi

          {
            echo "release=$release"
            echo "tag=v$version"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-apple-darwin
            runner: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          uname -m

      - name: Install musl tools
        if: contains(matrix.target, 'unknown-linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install target
        run: rustup target add "${{ matrix.target }}"

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package
        id: package
        run: |
          asset_name="$BIN_NAME-${{ matrix.target }}"

          mkdir -p dist
          cp "target/${{ matrix.target }}/release/$BIN_NAME" "dist/$asset_name"
          chmod 0755 "dist/$asset_name"

          {
            echo "asset_name=$asset_name"
            echo "artifact_name=$asset_name"
            echo "artifact_path=dist/$asset_name"
          } >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error

  release:
    name: Tag and release
    needs:
      - detect
      - build
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create tag
        env:
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          tag_commit="$(git rev-list -n 1 "$TAG" 2>/dev/null || true)"

          if [ -n "$tag_commit" ]; then
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG already points to $tag_commit, expected $GITHUB_SHA" >&2
              exit 1
            fi
            echo "Tag $TAG already points to $GITHUB_SHA"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          assets=(
            "dist/$BIN_NAME-aarch64-unknown-linux-musl"
            "dist/$BIN_NAME-x86_64-unknown-linux-musl"
            "dist/$BIN_NAME-aarch64-apple-darwin"
          )

          for asset in "${assets[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "Missing release asset: $asset" >&2
              exit 1
            fi
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes "Automated release for $TAG."
          fi

  publish-crate:
    name: Publish crate
    needs:
      - detect
      - release
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is required to publish to crates.io" >&2
            exit 1
          fi

          set +e
          output="$(cargo publish --locked --token "$CARGO_REGISTRY_TOKEN" 2>&1)"
          status=$?
          set -e

          printf '%s\n' "$output"

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if printf '%s\n' "$output" | grep -Eiq 'already.*(published|uploaded|exists)|previously uploaded'; then
            echo "codex-switch $VERSION is already published on crates.io."
            exit 0
          fi

          exit "$status"
